<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Subway Corridor + Basement + Stall</title>
    <style>
        * { user-select: none; -webkit-user-select: none; }
        body { margin: 0; overflow: hidden; font-family: 'Courier New', Courier, monospace; background: #000; }
        #blocker {
            position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.8); color: #fff; cursor: pointer; z-index: 100;
        }
        #blocker h1 { font-weight: normal; letter-spacing: 6px; font-size: 28px; margin-bottom: 10px; text-transform: uppercase; }
        #blocker p { color: #888; font-size: 14px; letter-spacing: 2px; margin: 4px; }
        #hint {
            position: absolute; left: 50%; bottom: 14%; transform: translateX(-50%);
            color: #fff; font-size: 16px; letter-spacing: 3px; padding: 8px 16px;
            background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.35);
            display: none; z-index: 50; pointer-events: none;
        }
        #dot { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%;
               background: rgba(255,255,255,0.55); z-index: 50; pointer-events: none; }
            #ammo { position: absolute; right: 4%; bottom: 5%; color: #fff; font-size: 26px; letter-spacing: 3px; z-index: 50; pointer-events: none; text-shadow: 0 0 6px #000; }
        #ammo small { display: block; font-size: 12px; color: #aaa; text-align: right; }
    </style>
</head>
<body>
    <div id="blocker">
        <h1>Subway Corridor</h1>
        <p>CLICK TO ENTER</p>
        <p>WASD move · Mouse look · E open / close door</p>
        <p>Left click shoot · R reload · F flashlight · shoot the lights and the windows</p>
        <p>Walk to the green door at the far end of the corridor</p>
    </div>
    <div id="dot"></div>
    <div id="hint"></div>
    <div id="ammo"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // --- 1. SETUP ---
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x070808);
        scene.fog = new THREE.FogExp2(0x0a0e12, 0.027);

        const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 100);
        camera.position.set(0, 1.7, 15);

        const rnd = (a, b) => a + Math.random() * (b - a);

        function mk(s, fn) {
            const c = document.createElement('canvas');
            c.width = c.height = s;
            const x = c.getContext('2d');
            fn(x, s);
            return c;
        }
        function tex(canvas, rx, ry) {
            const t = new THREE.CanvasTexture(canvas);
            t.wrapS = t.wrapT = THREE.RepeatWrapping;
            t.repeat.set(rx, ry);
            t.colorSpace = THREE.SRGBColorSpace;
            t.anisotropy = renderer.capabilities.getMaxAnisotropy();
            return t;
        }

        // =====================================================================
        //  ROOM 1: SUBWAY CORRIDOR  (world z from +30 to -30, door at z = -30)
        // =====================================================================
        function buildSubway(scene) {
        
        // --- TEXTURES ---
        function createTileWallTexture() {
            const size = 1024;
            const c = document.createElement('canvas');
            c.width = size; c.height = 512;
            const ctx = c.getContext('2d');

            ctx.fillStyle = '#2a2a2a';
            ctx.fillRect(0, 0, size, 512);

            const tileW = 32;
            const tileH = 32;
            for (let y = 0; y < 512; y += tileH) {
                for (let x = 0; x < size; x += tileW) {
                    const v = 180 + Math.random() * 40;
                    ctx.fillStyle = `rgb(${v}, ${v}, ${v})`;
                    ctx.fillRect(x + 1, y + 1, tileW - 2, tileH - 2);
                    
                    if (Math.random() > 0.8) {
                        ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.2})`;
                        ctx.fillRect(x + 1, y + 1, tileW - 2, tileH - 2);
                    }
                }
            }

            const grime = ctx.createLinearGradient(0, 512, 0, 300);
            grime.addColorStop(0, 'rgba(10, 15, 10, 0.9)');
            grime.addColorStop(1, 'rgba(10, 15, 10, 0)');
            ctx.fillStyle = grime;
            ctx.fillRect(0, 0, size, 512);

            // Graffiti
            ctx.save();
            ctx.translate(200, 250);
            ctx.font = '900 100px Impact, sans-serif';
            ctx.fillStyle = 'rgba(220, 100, 150, 0.7)';
            ctx.strokeStyle = 'rgba(50, 10, 20, 0.9)';
            ctx.lineWidth = 6;
            ctx.rotate(-0.1);
            ctx.strokeText('MING', 0, 0);
            ctx.fillText('MING', 0, 0);

            ctx.font = 'italic 900 120px cursive';
            ctx.fillStyle = 'rgba(20, 20, 20, 0.85)';
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.9)';
            ctx.lineWidth = 4;
            ctx.rotate(0.15);
            ctx.strokeText('NOIR', 300, 20);
            ctx.fillText('NOIR', 300, 20);

            ctx.beginPath();
            ctx.strokeStyle = 'rgba(220, 100, 150, 0.6)';
            ctx.lineWidth = 10;
            for(let i=0; i<5; i++) {
                ctx.moveTo(600, 100 + i*30);
                ctx.bezierCurveTo(700, 50, 750, 200, 850, 100 + i*30);
            }
            ctx.stroke();
            ctx.restore();

            return new THREE.CanvasTexture(c);
        }

        function createFloorTexture() {
            const size = 1024;
            const c = document.createElement('canvas');
            c.width = c.height = size;
            const ctx = c.getContext('2d');

            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, size, size);

            const tw = 128;
            const th = 128;
            for (let y = 0; y < size; y += th) {
                for (let x = 0; x < size; x += tw) {
                    const v = 80 + Math.random() * 30;
                    ctx.fillStyle = `rgb(${v}, ${v}, ${v})`;
                    ctx.fillRect(x + 2, y + 2, tw - 4, th - 4);
                    for(let i=0; i<50; i++) {
                        ctx.fillStyle = `rgba(0,0,0,${Math.random()*0.3})`;
                        ctx.fillRect(x + Math.random()*tw, y + Math.random()*th, Math.random()*20, Math.random()*20);
                    }
                }
            }
            return new THREE.CanvasTexture(c);
        }

        function createTrashCanTexture() {
            const c = document.createElement('canvas');
            c.width = 512; c.height = 512;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#111111';
            ctx.fillRect(0, 0, 512, 512);
            
            ctx.fillStyle = '#222';
            ctx.fillRect(0, 50, 512, 100);
            ctx.fillStyle = '#ddd';
            ctx.font = 'bold 40px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Litter', 256, 95);
            ctx.fillText('Stops here', 256, 135);

            ctx.save();
            ctx.translate(256, 320);
            ctx.rotate(-0.1);
            ctx.font = 'bold 90px "Comic Sans MS", cursive, sans-serif';
            ctx.fillStyle = 'rgba(200, 220, 210, 0.8)';
            ctx.strokeStyle = 'rgba(200, 220, 210, 0.9)';
            ctx.lineWidth = 3;
            ctx.textAlign = 'left';
            ctx.fillText('FUCK', -150, -30);
            ctx.fillText('COPS', -150, 70);
            
            ctx.fillRect(-150, 100, 20, 40);
            ctx.beginPath(); ctx.arc(-140, 90, 10, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(-90, 120, 15, 0, Math.PI*2); ctx.stroke();
            ctx.beginPath(); ctx.arc(-70, 120, 15, 0, Math.PI*2); ctx.stroke();

            const colors = ['#ff0000', '#ff8800', '#ffff00', '#00ff00', '#0000ff', '#8800ff'];
            colors.forEach((col, i) => {
                ctx.fillStyle = col;
                ctx.fillRect(-150, 160 + i*8, 300, 6);
            });
            ctx.restore();

            return new THREE.CanvasTexture(c);
        }

        function createVendingMachineTexture() {
            const c = document.createElement('canvas');
            c.width = 256; c.height = 512;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#cc2222';
            ctx.fillRect(0, 0, 256, 512);
            
            ctx.fillStyle = '#eee';
            ctx.fillRect(20, 100, 216, 300);
            
            for(let y=120; y<380; y+=50) {
                for(let x=30; x<210; x+=40) {
                    ctx.fillStyle = ['#3366cc', '#66cc33', '#cccc33'][Math.floor(Math.random()*3)];
                    ctx.fillRect(x, y, 30, 40);
                }
            }
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.fillRect(20, 100, 100, 300);

            const tex = new THREE.CanvasTexture(c);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        function createClockTexture() {
            const c = document.createElement('canvas');
            c.width = c.height = 256;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(128, 128, 120, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#000'; ctx.lineWidth = 8; ctx.stroke();
            
            ctx.fillStyle = '#000';
            for(let i=0; i<12; i++) {
                const a = i * Math.PI / 6;
                ctx.save();
                ctx.translate(128, 128);
                ctx.rotate(a);
                ctx.fillRect(-4, -110, 8, 20);
                ctx.restore();
            }
            
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 8;
            ctx.beginPath(); ctx.moveTo(128, 128); ctx.lineTo(60, 80); ctx.stroke();
            ctx.lineWidth = 6;
            ctx.beginPath(); ctx.moveTo(128, 128); ctx.lineTo(70, 180); ctx.stroke();
            
            return new THREE.CanvasTexture(c);
        }

        function createNewspaperTexture() {
            const c = document.createElement('canvas');
            c.width = 512; c.height = 512;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#e8e3d5';
            ctx.fillRect(0, 0, 512, 512);

            ctx.fillStyle = '#111';
            ctx.font = 'bold 42px serif';
            ctx.fillText('THE DAILY', 30, 60);
            ctx.font = 'bold 18px serif';
            ctx.fillText('VOL. CXII - NO. 42', 30, 90);

            ctx.fillStyle = '#444';
            ctx.fillRect(30, 110, 200, 150);
            ctx.fillStyle = '#888';
            ctx.fillRect(40, 120, 180, 130);

            ctx.fillStyle = '#222';
            for (let col = 0; col < 2; col++) {
                const x = 30 + col * 240;
                for (let i = 0; i < 25; i++) {
                    ctx.fillRect(x, 120 + i * 12, Math.random() * 180 + 20, 4);
                }
            }
            for (let col = 0; col < 2; col++) {
                const x = 30 + col * 240;
                for (let i = 0; i < 15; i++) {
                    ctx.fillRect(x, 280 + i * 12, Math.random() * 180 + 20, 4);
                }
            }

            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.fillRect(255, 0, 2, 512);
            ctx.fillRect(0, 256, 512, 2);

            const tex = new THREE.CanvasTexture(c);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        function createPerforatedMetalTexture() {
            const c = document.createElement('canvas');
            c.width = 256; c.height = 256;
            const ctx = c.getContext('2d');
            
            ctx.fillStyle = '#a0a0a0';
            ctx.fillRect(0, 0, 256, 256);
            
            ctx.fillStyle = '#222222';
            for (let y = 0; y < 256; y += 4) {
                for (let x = 0; x < 256; x += 4) {
                    ctx.beginPath();
                    ctx.arc(x, y, 1.2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            
            const tex = new THREE.CanvasTexture(c);
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(4, 2); 
            return tex;
        }

        // --- STALL TEXTURES ---
        function createPlasterTexture() {
            const c = document.createElement('canvas');
            c.width = 1024; c.height = 512;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#d0d0d0';
            ctx.fillRect(0, 0, 1024, 512);
            for(let i=0; i<100; i++) {
                ctx.fillStyle = `rgba(0,0,0,${Math.random()*0.05})`;
                ctx.beginPath(); ctx.arc(Math.random()*1024, Math.random()*512, Math.random()*50+10, 0, Math.PI*2); ctx.fill();
            }
            const tex = new THREE.CanvasTexture(c);
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(1, 1);
            return tex;
        }

        function createStoneTexture() {
            const c = document.createElement('canvas');
            c.width = 1024; c.height = 512;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#8a8f94';
            ctx.fillRect(0, 0, 1024, 512);
            for(let i=0; i<20; i++) {
                ctx.strokeStyle = `rgba(255,255,255,${Math.random()*0.2})`;
                ctx.lineWidth = Math.random()*3;
                ctx.beginPath(); let x = Math.random()*1024; let y = Math.random()*512; ctx.moveTo(x, y);
                for(let j=0; j<10; j++) { x += (Math.random()-0.5)*100; y += (Math.random()-0.5)*50; ctx.lineTo(x, y); }
                ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(c);
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function createSignTexture() {
            const c = document.createElement('canvas');
            c.width = 1024; c.height = 256;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#1a237e';
            ctx.fillRect(0, 0, 1024, 256);
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 10; ctx.strokeRect(10, 10, 1004, 236);
            ctx.fillStyle = '#d32f2f';
            ctx.beginPath(); ctx.arc(80, 128, 40, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(944, 128, 40, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(80, 128, 25, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(944, 128, 25, 0, Math.PI*2); ctx.fill();
            ctx.textAlign = 'center';
            ctx.font = 'bold 70px Arial, sans-serif'; ctx.fillText('PLATFORM STALL', 512, 150);
            ctx.font = 'bold 24px sans-serif'; ctx.fillText('STATION ROAD  ·  PH: 555-0192', 512, 200);
            ctx.font = '30px sans-serif'; ctx.fillText('|| PLATFORM STALL ||', 512, 60);
            const tex = new THREE.CanvasTexture(c);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        function createShelfTexture() {
            const c = document.createElement('canvas');
            c.width = 1024; c.height = 512;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#222'; ctx.fillRect(0, 0, 1024, 512);
            for(let y=0; y<512; y+=100) { ctx.fillStyle = '#555'; ctx.fillRect(0, y, 1024, 10); }
            const colors = ['#ff4444', '#44ff44', '#4444ff', '#ffff44', '#ff44ff', '#44ffff', '#ff8800', '#8844ff'];
            for(let y=15; y<512; y+=100) {
                for(let x=10; x<1024; x+=Math.random()*40+20) {
                    ctx.fillStyle = colors[Math.floor(Math.random()*colors.length)];
                    const w = Math.random()*30+20; const h = Math.random()*40+30;
                    ctx.fillRect(x, y + (90 - h), w, h);
                    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(x+5, y + (90 - h) + 10, w-10, 5);
                }
            }
            const tex = new THREE.CanvasTexture(c);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        function createGrilleTexture() {
            const c = document.createElement('canvas');
            c.width = 256; c.height = 128;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#333'; ctx.fillRect(0, 0, 256, 128);
            ctx.fillStyle = '#b08d57';
            for(let y=10; y<128; y+=20) { ctx.fillRect(10, y, 236, 8); }
            const tex = new THREE.CanvasTexture(c);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        // --- 3. MATERIALS ---
        const wallTex = createTileWallTexture();
        wallTex.wrapS = wallTex.wrapT = THREE.RepeatWrapping;
        wallTex.repeat.set(4, 1);
        const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.4, metalness: 0.1 });

        const floorTex = createFloorTexture();
        floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
        floorTex.repeat.set(3, 15);
        const floorMat = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.6, metalness: 0.2 });

        const ceilMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1c, roughness: 0.9 });
        const trashMat = new THREE.MeshStandardMaterial({ map: createTrashCanTexture(), roughness: 0.6 });
        const vendingMat = new THREE.MeshStandardMaterial({ 
            map: createVendingMachineTexture(), 
            emissive: 0xffffff, 
            emissiveMap: createVendingMachineTexture(), 
            emissiveIntensity: 0.5 
        });
        
        const metalMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8, roughness: 0.4 });
        const chromeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.95, roughness: 0.1 });
        const perforatedMat = new THREE.MeshStandardMaterial({ map: createPerforatedMetalTexture(), metalness: 0.7, roughness: 0.3 });
        const darkFrameMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.5, roughness: 0.6 });

        const clockMat = new THREE.MeshBasicMaterial({ map: createClockTexture(), side: THREE.DoubleSide });
        const paperMat = new THREE.MeshStandardMaterial({ map: createNewspaperTexture(), side: THREE.DoubleSide, roughness: 0.9 });

        // Stall Materials
        const stallPlasterMat = new THREE.MeshStandardMaterial({ map: createPlasterTexture(), roughness: 0.9 });
        const stallStoneMat = new THREE.MeshStandardMaterial({ map: createStoneTexture(), roughness: 0.6 });
        const stallSignMat = new THREE.MeshStandardMaterial({ map: createSignTexture(), roughness: 0.4, emissive: 0x222222 });
        const stallShelfMat = new THREE.MeshStandardMaterial({ map: createShelfTexture(), roughness: 0.8 });
        const stallGrilleMat = new THREE.MeshStandardMaterial({ map: createGrilleTexture(), roughness: 0.7 });
        const counterTopMat = new THREE.MeshStandardMaterial({ color: 0x4a3b2c, roughness: 0.5 });
        const tealMat = new THREE.MeshStandardMaterial({ color: 0x26a69a, roughness: 0.5 });
        const redMat = new THREE.MeshStandardMaterial({ color: 0xd32f2f, roughness: 0.6 });

        // --- 4. BUILD THE CORRIDOR ---
        const corridorW = 8;
        const corridorH = 3.5;
        const corridorL = 60;

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(corridorW, corridorL), floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const ceil = new THREE.Mesh(new THREE.PlaneGeometry(corridorW, corridorL), ceilMat);
        ceil.rotation.x = Math.PI / 2;
        ceil.position.set(0, corridorH, 0);
        ceil.receiveShadow = true;
        scene.add(ceil);

        // Left wall (split for the stall)
        const stallZ = -5;
        const stallW = 6;
        
        const leftWall1 = new THREE.Mesh(new THREE.PlaneGeometry(35 - stallW/2, corridorH), wallMat);
        leftWall1.rotation.y = Math.PI / 2;
        leftWall1.position.set(-corridorW / 2, corridorH / 2, 12.5 + stallW/4); 
        leftWall1.receiveShadow = true;
        scene.add(leftWall1);

        const leftWall2 = new THREE.Mesh(new THREE.PlaneGeometry(25 - stallW/2, corridorH), wallMat);
        leftWall2.rotation.y = Math.PI / 2;
        leftWall2.position.set(-corridorW / 2, corridorH / 2, -17.5 - stallW/4);
        leftWall2.receiveShadow = true;
        scene.add(leftWall2);

        const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(corridorL, corridorH), wallMat);
        rightWall.rotation.y = -Math.PI / 2;
        rightWall.position.set(corridorW / 2, corridorH / 2, 0);
        rightWall.receiveShadow = true;
        scene.add(rightWall);

        // --- STALL INTEGRATION ---
        function createPlatformStall(scene, x, z) {
            const group = new THREE.Group();
            group.position.set(x, 0, z);
            group.rotation.y = Math.PI / 2; // Facing right

            const stallH = 2.8;
            const sW = 6; // Stall width
            const sD = 2.5; // Stall depth

            // Interior Back Wall with shelves
            const backShelf = new THREE.Mesh(new THREE.PlaneGeometry(sW, stallH), stallShelfMat);
            backShelf.position.set(0, stallH/2, -sD);
            group.add(backShelf);

            // Side walls inside
            const innerLeft = new THREE.Mesh(new THREE.PlaneGeometry(sD, stallH), stallPlasterMat);
            innerLeft.rotation.y = Math.PI / 2;
            innerLeft.position.set(-sW/2, stallH/2, -sD/2);
            group.add(innerLeft);

            const innerRight = new THREE.Mesh(new THREE.PlaneGeometry(sD, stallH), stallPlasterMat);
            innerRight.rotation.y = -Math.PI / 2;
            innerRight.position.set(sW/2, stallH/2, -sD/2);
            group.add(innerRight);

            // Inner ceiling
            const innerCeil = new THREE.Mesh(new THREE.PlaneGeometry(sW, sD), stallPlasterMat);
            innerCeil.rotation.x = Math.PI / 2;
            innerCeil.position.set(0, stallH, -sD/2);
            group.add(innerCeil);

            // Counter Base
            const counterBase = new THREE.Mesh(new THREE.BoxGeometry(sW, 1.1, 1), stallStoneMat);
            counterBase.position.set(0, 0.55, 0.5);
            counterBase.castShadow = true; counterBase.receiveShadow = true;
            group.add(counterBase);

            // Counter Top
            const counterTop = new THREE.Mesh(new THREE.BoxGeometry(sW + 0.2, 0.1, 1.2), counterTopMat);
            counterTop.position.set(0, 1.15, 0.5);
            counterTop.castShadow = true; counterTop.receiveShadow = true;
            group.add(counterTop);

            // Sign
            const sign = new THREE.Mesh(new THREE.PlaneGeometry(sW - 0.5, 1.2), stallSignMat);
            sign.position.set(0, stallH + 0.6, 0);
            group.add(sign);

            // Grilles
            for(let i=0; i<3; i++) {
                const grille = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 0.8), stallGrilleMat);
                grille.position.set(-2 + i*2, stallH + 1.6, 0);
                group.add(grille);
            }

            // Top Wall (Lintel above sign)
            const topWall = new THREE.Mesh(new THREE.BoxGeometry(sW, corridorH - stallH - 1.2, 0.5), stallPlasterMat);
            topWall.position.set(0, stallH + 1.2 + (corridorH - stallH - 1.2)/2, 0);
            group.add(topWall);

            // Pillars
            const pillarL = new THREE.Mesh(new THREE.BoxGeometry(0.4, stallH, 0.4), stallStoneMat);
            pillarL.position.set(-sW/2 - 0.2, stallH/2, 0);

        function createWallTexture(isBack = false) {
            const size = 1024;

            c.width = size; c.height = 512;
            const ctx = c.getContext('2d');

            ctx.fillStyle = '#77756f';
            ctx.fillRect(0, 0, c.width, c.height);

            for (let i = 0; i < 95; i++) {
                const x = Math.random() * c.width;
                const y = Math.random() * c.height;
                const rx = 18 + Math.random() * 150;
                const ry = 10 + Math.random() * 65;
                const shade = Math.random() > 0.5 ? 35 : 5;
                const alpha = 0.025 + Math.random() * 0.09;
                const g = ctx.createRadialGradient(x, y, 2, x, y, rx);
                g.addColorStop(0, `rgba(${shade},${shade},${shade},${alpha})`);
                g.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = g;
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(1, ry / rx);
                ctx.beginPath();
                ctx.arc(0, 0, rx, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            const image = ctx.getImageData(0, 0, c.width, c.height);
            const data = image.data;
            for (let i = 0; i < data.length; i += 4) {
                const n = (Math.random() - 0.5) * 24;
                data[i] = Math.max(0, Math.min(255, data[i] + n));
                data[i + 1] = Math.max(0, Math.min(255, data[i + 1] + n));
                data[i + 2] = Math.max(0, Math.min(255, data[i + 2] + n));
            }
            ctx.putImageData(image, 0, 0);

            for (let i = 0; i < 1800; i++) {
                const x = Math.random() * c.width;
                const y = Math.random() * c.height;
                const r = Math.random() * 1.5 + 0.25;
                ctx.fillStyle = `rgba(20,18,16,${Math.random() * 0.20})`;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            const damp = ctx.createLinearGradient(0, 210, 0, 512);
            damp.addColorStop(0, 'rgba(25,28,25,0)');
            damp.addColorStop(0.65, 'rgba(25,28,25,0.10)');
            damp.addColorStop(1, 'rgba(18,20,18,0.28)');

            ctx.fillRect(0, 0, c.width, c.height);

                }
                ctx.stroke();
            }

            if (isBack) {
                ctx.save();
                ctx.translate(512, 220);
                ctx.strokeStyle = 'rgba(38,38,36,0.55)';
                ctx.lineWidth = 16;
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    const a = (i * 4 * Math.PI) / 5 - Math.PI / 2;
                    const x = Math.cos(a) * 200;
                    const y = Math.sin(a) * 200;
                    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.stroke();
                ctx.font = 'italic bold 130px Impact, sans-serif';
                ctx.fillStyle = 'rgba(150,75,48,0.52)';
                ctx.strokeStyle = 'rgba(35,25,20,0.65)';
                ctx.lineWidth = 4;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.rotate(-0.05);
                ctx.fillText('THANKS', 0, 0);
                ctx.strokeText('THANKS', 0, 0);
                ctx.restore();
            }

            const tex = new THREE.CanvasTexture(c);
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(1.5, 1);

            const colorTex = new THREE.CanvasTexture(c);

                const v = (bImg.data[i]*0.299 + bImg.data[i+1]*0.587 + bImg.data[i+2]*0.114);

            const bumpTex = new THREE.CanvasTexture(bc);

            return { colorTex, bumpTex };

        const DOOR_W = 2, DOOR_H = 2.5;

        function wallPiece(mat, fullW, fullH, x0, x1, y0, y1, z, flip) {
            const m = mat.clone();
            m.shadowSide = THREE.DoubleSide;        // so the wall blocks light from either room
            const g = new THREE.PlaneGeometry(x1 - x0, y1 - y0);
            const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
            const p = g.attributes.position, uv = g.attributes.uv;
            for (let i = 0; i < p.count; i++) {      // keep the texture continuous with a full wall
                uv.setXY(i, (p.getX(i) + cx + fullW / 2) / fullW, (p.getY(i) + cy) / fullH);
            }
            if (flip) g.rotateY(Math.PI);
            g.translate(cx, cy, z);
            const mesh = new THREE.Mesh(g, m);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            return mesh;
        }

        const cinematicShader = {
            uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uAberration: { value: 0.0008 } },
            vertexShader: `
                varying vec2 vUv;
                void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float uTime;
                uniform float uAberration;
                varying vec2 vUv;
                void main() {
                    vec2 uv = vUv;
                    vec2 dir = uv - vec2(0.5);
                    float dist = length(dir);
                    float r = texture2D(tDiffuse, uv - dir * uAberration * dist).r;
                    float g = texture2D(tDiffuse, uv).g;
                    float b = texture2D(tDiffuse, uv + dir * uAberration * dist).b;
                    vec3 color = vec3(r, g, b);
                    color *= smoothstep(0.8, 0.2, dist);
                    color += (fract(sin(dot(uv + uTime, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) * 0.012;
                    gl_FragColor = vec4(color, 1.0);
                }
            `

        bmLocal.forEach(b => colliders.push(b.translate(new THREE.Vector3(0, 0, BASEMENT_OFFSET_Z))));

        subway.extra.colliders.forEach(b => colliders.push(b));
        // AUTO-COLLIDERS: every solid prop (stall, counters, benches, bins, crates, tables, pillars...)
        // gets a collision box from its real mesh bounds, so nothing is hand-placed or out of sync.
        scene.updateMatrixWorld(true);
        const noCollide = new Set(subway.extra.pickups);
        const autoBox = new THREE.Box3(), autoSize = new THREE.Vector3();
        scene.traverse(o => {
            if (!o.isMesh || o.userData.decal || noCollide.has(o) || !o.visible) return;
            for (let p = o.parent; p; p = p.parent) if (p === camera || p === doorPivot) return;
            autoBox.setFromObject(o); autoBox.getSize(autoSize);
            if (autoBox.max.y < 0.25 || autoBox.min.y > 1.9) return;      // floor litter / ceiling fittings
            if (Math.max(autoSize.x, autoSize.z) < 0.15 || autoSize.y < 0.05) return;  // tiny or flat
            colliders.push(autoBox.clone());
        });

        // safety: never start inside a collider
        { const sp = camera.position; const pb = new THREE.Box3(); const hit = () => { pb.min.set(sp.x - 0.3, 0, sp.z - 0.3); pb.max.set(sp.x + 0.3, 1.8, sp.z + 0.3); return colliders.some(b => pb.intersectsBox(b)); };
          for (let z = 15; z < 29 && hit(); z += 0.5) sp.z = z; }

        // door colliders (closed panel, and the open leaf)
        const doorClosedBox = new THREE.Box3(new THREE.Vector3(-DOOR_W/2, 0, DOOR_Z - 0.12), new THREE.Vector3(DOOR_W/2, DOOR_H, DOOR_Z + 0.12));
        const doorOpenBox = new THREE.Box3(new THREE.Vector3(-DOOR_W/2 - 0.08, 0, DOOR_Z - 2.0), new THREE.Vector3(-DOOR_W/2 + 0.08, DOOR_H, DOOR_Z));

        const playerRadius = 0.3;
        const playerBox = new THREE.Box3();
        function checkCollision(pos) {
            playerBox.min.set(pos.x - playerRadius, 0, pos.z - playerRadius);
            playerBox.max.set(pos.x + playerRadius, 1.8, pos.z + playerRadius);
            for (const box of colliders) if (playerBox.intersectsBox(box)) return true;
            if (doorAngle < 0.9 && playerBox.intersectsBox(doorClosedBox)) return true;
            if (doorAngle >= 0.9 && playerBox.intersectsBox(doorOpenBox)) return true;
            return false;
        }

        const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };


        // =====================================================================
        //  FIRST-PERSON PISTOL
        // =====================================================================
        scene.add(camera);
        const gunMetal = new THREE.MeshStandardMaterial({ color: 0x1d2024, metalness: 0.85, roughness: 0.32 });
        const gunPoly = new THREE.MeshStandardMaterial({ color: 0x101112, metalness: 0.1, roughness: 0.85 });
        const skinMat = new THREE.MeshStandardMaterial({ color: 0x9a7358, roughness: 0.8 });
        const sleeveMat = new THREE.MeshStandardMaterial({ color: 0x23282b, roughness: 0.95 });
        const gun = new THREE.Group();
        const gb = (w, h, d, m, x, y, z, rx) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); if (rx) o.rotation.x = rx; gun.add(o); return o; };
        gb(0.05, 0.055, 0.30, gunMetal, 0, 0.03, -0.02);
        gb(0.045, 0.035, 0.26, gunPoly, 0, -0.01, 0);
        gb(0.04, 0.11, 0.06, gunPoly, 0, -0.08, 0.08, 0.28);
        gb(0.012, 0.02, 0.012, gunMetal, 0, 0.065, -0.16);
        gb(0.03, 0.018, 0.012, gunMetal, 0, 0.065, 0.1);
        gb(0.01, 0.03, 0.07, gunPoly, 0, -0.04, -0.03);
        const tip = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.04, 10), gunMetal); tip.rotation.x = Math.PI / 2; tip.position.set(0, 0.03, -0.18); gun.add(tip);
        gb(0.065, 0.07, 0.1, skinMat, 0, -0.09, 0.1, 0.28);
        gb(0.09, 0.09, 0.4, sleeveMat, 0.03, -0.13, 0.32, 0.15);
        const flashT = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d'); const g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, '#fff'); g.addColorStop(0.3, '#ffd070'); g.addColorStop(1, 'rgba(255,120,0,0)'); x.fillStyle = g; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();
        const flash = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 0.2), new THREE.MeshBasicMaterial({ map: flashT, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
        flash.position.set(0, 0.03, -0.24); flash.visible = false; gun.add(flash);
        gun.position.set(0.2, -0.19, -0.4);
        gun.traverse(o => { if (o.isMesh) o.frustumCulled = false; });
        camera.add(gun);
        const muzzleLight = new THREE.PointLight(0xffaa55, 0, 12, 2); muzzleLight.position.set(0.2, -0.05, -0.7); camera.add(muzzleLight);
        const gunFill = new THREE.PointLight(0xffffff, 0.6, 2, 2); gunFill.position.set(0.3, 0.2, -0.1); camera.add(gunFill);

        const torch = new THREE.SpotLight(0xfff2dd, 0, 20, 0.38, 0.55, 1.5); torch.position.set(0.2, -0.1, 0); torch.target.position.set(0, 0, -5); camera.add(torch, torch.target);
        document.addEventListener('keydown', e => { if (e.code === 'KeyF' && controls.isLocked) { torch.intensity = torch.intensity ? 0 : 45; click(1100); } });
        const MAG = 12;
        let ammo = MAG, reserve = 36, cool = 0, recoil = 0, kickPending = 0, muzzleT = 0, reloadT = 0, swayX = 0, swayY = 0;
        const ammoEl = document.getElementById('ammo');
        const updHud = () => { ammoEl.innerHTML = `${ammo} / ${reserve}<small>${reloadT > 0 ? 'RELOADING' : (ammo === 0 ? 'PRESS R' : '9MM')}</small>`; };
        updHud();

        // audio (synthesised)
        let ac = null;
        const initAudio = () => { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); };
        controls.addEventListener('lock', initAudio);
        function click(freq = 1800) { if (!ac) return; const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain(); o.type = 'square'; o.frequency.value = freq; g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 0.06); }
        function bang() {
            if (!ac) return; const t = ac.currentTime, len = Math.floor(ac.sampleRate * 0.35);
            const buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
            for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
            const s = ac.createBufferSource(); s.buffer = buf;
            const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(5000, t); f.frequency.exponentialRampToValueAtTime(300, t + 0.3);
            const g = ac.createGain(); g.gain.value = 0.9; s.connect(f).connect(g).connect(ac.destination); s.start(t);
            const o = ac.createOscillator(), og = ac.createGain(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.15);
            og.gain.setValueAtTime(0.8, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.18); o.connect(og).connect(ac.destination); o.start(t); o.stop(t + 0.2);
        }

        // bullet holes + sparks
        const holeT = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d'); const g = x.createRadialGradient(32, 32, 2, 32, 32, 30); g.addColorStop(0, 'rgba(0,0,0,0.95)'); g.addColorStop(0.35, 'rgba(10,10,10,0.8)'); g.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = g; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();
        const holeB = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d'); const g = x.createRadialGradient(32, 32, 0, 32, 32, 30); g.addColorStop(0, '#000'); g.addColorStop(0.3, '#222'); g.addColorStop(0.45, '#ddd'); g.addColorStop(1, '#888'); x.fillStyle = g; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();
        const holeMat = new THREE.MeshStandardMaterial({ map: holeT, bumpMap: holeB, bumpScale: 4, roughness: 0.85, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -4 });
        const holeGeo = new THREE.PlaneGeometry(1, 1);
        const decals = [];
        function decal(p, n) {
            const m = new THREE.Mesh(holeGeo, holeMat); m.userData.decal = true; const sc = rnd(0.07, 0.11); m.scale.set(sc, sc, 1);
            m.position.copy(p).addScaledVector(n, 0.004); m.lookAt(p.clone().add(n)); m.rotateZ(Math.random() * 6.28);
            scene.add(m); decals.push(m); if (decals.length > 60) scene.remove(decals.shift());
        }
        const sparks = [], sparkGeo = new THREE.BoxGeometry(0.012, 0.012, 0.012), sparkMat = new THREE.MeshBasicMaterial({ color: 0xffcc66, toneMapped: false });
        function spark(p, n, cnt = 8) {
            for (let i = 0; i < cnt; i++) {
                const m = new THREE.Mesh(sparkGeo, sparkMat); m.userData.decal = true; m.position.copy(p);
                m.userData.v = n.clone().multiplyScalar(rnd(1, 3)).add(new THREE.Vector3(rnd(-1, 1), rnd(-0.5, 1.5), rnd(-1, 1))); m.userData.life = 0.35;
                scene.add(m); sparks.push(m);
            }
            while (sparks.length > 80) scene.remove(sparks.shift());
        }

        const ray = new THREE.Raycaster(), centre = new THREE.Vector2(0, 0);
        function shootRay() {
            ray.setFromCamera(centre, camera);
            const hits = ray.intersectObjects(scene.children.filter(c => c !== camera), true).filter(h => h.object.isMesh && !h.object.userData.decal && h.distance > 0.3);
            if (!hits.length) return;
            const h = hits[0];
            const n = h.face ? h.face.normal.clone().transformDirection(h.object.matrixWorld) : new THREE.Vector3(0, 1, 0);
            if (n.dot(ray.ray.direction) > 0) n.negate();
            if (h.object.userData.glass) { spark(h.point, n, 5); subway.extra.hitGlass(h.object, h.point, n, ray.ray.direction); return; }
            spark(h.point, n); decal(h.point, n);
            const L = h.object.userData.light;
            if (L && !L.userData.dead) { L.userData.dead = true; L.intensity = 0; h.object.material.color.set(0x222222); spark(h.point, n, 24); }
        }

        function fire() {
            if (reloadT > 0 || cool > 0) return;
            if (ammo <= 0) { click(600); cool = 0.25; if (reserve > 0) reload(); return; }
            ammo--; cool = 0.16; recoil = 1; kickPending += 0.02; muzzleT = 0.05; flash.rotation.z = Math.random() * 6.28;
            bang(); shootRay(); updHud();
        }
        function reload() {
            if (reloadT > 0 || ammo === MAG || reserve <= 0) return;
            reloadT = 1.2; click(900); setTimeout(() => click(1500), 600); setTimeout(() => click(1200), 1000); updHud();
        }
        document.addEventListener('mousedown', e => { if (controls.isLocked && e.button === 0) fire(); });
        document.addEventListener('keydown', e => { if (e.code === 'KeyR' && controls.isLocked) reload(); });
        document.addEventListener('mousemove', e => { if (controls.isLocked) { swayX = Math.max(-40, Math.min(40, swayX + e.movementX)); swayY = Math.max(-40, Math.min(40, swayY + e.movementY)); } });

        function updateGun(delta, tt, speed) {
            cool = Math.max(0, cool - delta); recoil = Math.max(0, recoil - delta * 7);
            if (reloadT > 0) { reloadT -= delta; if (reloadT <= 0) { reloadT = 0; const take = Math.min(MAG - ammo, reserve); ammo += take; reserve -= take; updHud(); } }
            const dip = reloadT > 0 ? Math.sin(Math.PI * (1 - reloadT / 1.2)) : 0;
            const bob = Math.min(speed, 3) / 3;
            gun.position.set(0.2 + Math.sin(tt * 6) * 0.006 * bob - swayX * 0.0005, -0.19 + Math.abs(Math.sin(tt * 6)) * 0.008 * bob + swayY * 0.0005 - dip * 0.2, -0.4 + recoil * 0.06);
            gun.rotation.set(recoil * 0.18 + dip * 0.9, 0, -swayX * 0.001);
            swayX *= 0.88; swayY *= 0.88;
            muzzleT -= delta; flash.visible = muzzleT > 0; muzzleLight.intensity = muzzleT > 0 ? 30 : 0;
            if (kickPending > 0.0001) { const d = kickPending * Math.min(1, delta * 20); camera.rotation.x += d; kickPending -= d; }
            for (let i = sparks.length - 1; i >= 0; i--) {
                const m = sparks[i], u = m.userData; u.v.y -= 9 * delta; m.position.addScaledVector(u.v, delta); u.life -= delta;
                if (u.life <= 0) { scene.remove(m); sparks.splice(i, 1); }
            }
            for (const p of subway.extra.pickups) {
                if (p.visible && Math.hypot(camera.position.x - p.position.x, camera.position.z - p.position.z) < 1.0) { p.visible = false; reserve += 12; click(700); updHud(); }
            }
        }

        // =====================================================================
        //  LOOP
        // =====================================================================
        const clockSys = new THREE.Clock();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clockSys.getDelta(), 0.1);
            const tt = clockSys.getElapsedTime();
            cinematicPass.uniforms.uTime.value = tt;
            subway.extra.tick.forEach(f => f(tt));
            updateGun(delta, tt, controls.isLocked ? velocity.length() : 0);

            // door animation
            doorAngle += (doorTarget - doorAngle) * Math.min(1, delta * 5);
            if (Math.abs(doorTarget - doorAngle) < 0.002) doorAngle = doorTarget;
            doorPivot.rotation.y = doorAngle;

            // basement ambient only inside the basement (a little spills out when the door is open)
            const inside = smooth(-29.5, -31, camera.position.z);
            cinematicPass.uniforms.uAberration.value = 0.0008 * (1 - inside);
            const spill = 0.35 * (doorAngle / DOOR_OPEN_ANGLE);
            const f = Math.max(inside, spill);
            bmAmbient.intensity = 1.5 * f;
            bmHemi.intensity = 1.5 * f;

            if (controls.isLocked) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(keys.w) - Number(keys.s);
                direction.x = Number(keys.d) - Number(keys.a);
                direction.normalize();

                if (keys.w || keys.s) velocity.z -= direction.z * 30.0 * delta;
                if (keys.a || keys.d) velocity.x -= direction.x * 30.0 * delta;

                // world-space movement vector from view direction
                const fwd = camera.getWorldDirection(new THREE.Vector3()); fwd.y = 0;
                if (fwd.lengthSq() > 1e-6) fwd.normalize(); else fwd.set(0, 0, -1);
                const rgt = new THREE.Vector3(-fwd.z, 0, fwd.x);
                const a = -velocity.x * delta, b = -velocity.z * delta;
                const mx = rgt.x * a + fwd.x * b, mz = rgt.z * a + fwd.z * b;
                const steps = Math.max(1, Math.ceil(Math.max(Math.abs(mx), Math.abs(mz)) / 0.05));
                const p = camera.position;
                for (let i = 0; i < steps; i++) {
                    p.x += mx / steps; if (checkCollision(p)) { p.x -= mx / steps; velocity.x *= 0.5; }
                    p.z += mz / steps; if (checkCollision(p)) { p.z -= mz / steps; velocity.z *= 0.5; }
                }
                // hard safety bounds so the player can never leave the two rooms
                const lim = p.z > DOOR_Z + 0.4 ? 3.7 : 4.7;
                p.x = Math.max(-lim, Math.min(lim, p.x)); p.z = Math.max(-39.7, Math.min(29.7, p.z));

                camera.position.y = 1.7;

                if (nearDoor()) {
                    hint.textContent = doorTarget === 0 ? '[E]  OPEN DOOR' : '[E]  CLOSE DOOR';
                    hint.style.display = 'block';
                } else {
                    hint.style.display = 'none';
                }
            }

            const sh = subway.extra.shake || 0;
            camera.rotation.z = Math.sin(tt * 43) * 0.006 * sh; camera.position.y = 1.7 + Math.sin(tt * 57) * 0.02 * sh;
            composer.render();
        }

        addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
            composer.setSize(innerWidth, innerHeight);
        });

        animate();
    </script>
</body>
</html>
